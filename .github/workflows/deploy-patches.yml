name: Deploy Patches

on:
  workflow_run:
    workflows: [Validate patch packages]
    types: [completed]
    branches: [main, v1]

permissions:
  contents: write

concurrency:
  group: publish-translation-patches
  cancel-in-progress: false

jobs:
  publish:
    # Only validated trusted pushes; never run PR code with write credentials.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Hydrate pinned build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kitor/tools/hydrate_patch_inputs.py --repo "$GITHUB_REPOSITORY"
      - name: Publish immutable packages and advance registry
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python kitor/tools/publish_patch_releases.py
