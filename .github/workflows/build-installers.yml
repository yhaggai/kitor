name: Build Kitor installers

on:
  pull_request:
    paths:
      - '.github/workflows/classify-translation-pr.yml'
      - 'kitor/tools/check_translation_pr.py'
      - 'kitor/src/**'
      - 'kitor/src-tauri/**'
      - 'kitor/patches/**'
      - 'patches-workspace/**'
      - 'kitor/tests/**'
      - 'kitor/tools/app_release.py'
      - 'kitor/tools/test_app_release.py'
      - 'kitor/package.json'
      - 'bun.lock'
      - '.github/workflows/build-installers.yml'
      - '.github/workflows/release-app.yml'
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload unsigned preview installers
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  translation-scope:
    uses: ./.github/workflows/classify-translation-pr.yml
  installer:
    needs: translation-scope
    if: needs.translation-scope.outputs.translation_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Keep `app` so Tauri does not delete kitor.app before verify.
            bundle: app,dmg
            bundle_dir: dmg
            artifact: macos-apple-silicon
            extension: dmg
          - os: windows-latest
            bundle: nsis
            bundle_dir: nsis
            artifact: windows-x64
            extension: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test update states and release manifests
        run: |
          bun test kitor/tests/appUpdates.test.ts
          python -m unittest discover -s kitor/tools -p test_app_release.py
          python kitor/tools/app_release.py validate
      - name: Test installation coordination
        working-directory: kitor/src-tauri
        run: cargo test --locked --lib services::app_updates::tests
      - name: Smoke test bundled GOG extractor on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./kitor/src-tauri/vendor/innoextract/innoextract-x86_64-pc-windows-msvc.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer
        working-directory: kitor
        run: bun run tauri build --bundles ${{ matrix.bundle }} -- --locked
      - name: Verify the macOS bundle contains a working GOG extractor
        if: runner.os == 'macOS'
        run: |
          tool=kitor/src-tauri/target/release/bundle/macos/kitor.app/Contents/MacOS/innoextract
          env PATH=/usr/bin:/bin "$tool" --version
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        with:
          name: kitor-${{ matrix.artifact }}
          path: kitor/src-tauri/target/release/bundle/${{ matrix.bundle_dir }}/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7
