name: Contribution Worker

on:
  pull_request:
    paths:
      - 'tools/contribution-worker/**'
      - '.github/workflows/deploy-contribution-worker.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy (production requires environment approval)
        type: choice
        required: true
        default: staging
        options: [staging, production]

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/contribution-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/contribution-worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check deployment scripts
        run: |
          node --check scripts/deployment-config.mjs
          node --check scripts/deployment-secrets.mjs
          node --check scripts/check-deployment.mjs
      - name: Build Worker without publishing
        run: npx --no-install wrangler deploy --dry-run --outdir .wrangler/ci-build

  deploy:
    needs: validate
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    concurrency:
      group: contribution-worker-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: tools/contribution-worker
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      BOT_APP_ID: ${{ vars.BOT_APP_ID }}
      NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED }}
      NOTIFICATION_FROM: ${{ vars.NOTIFICATION_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/contribution-worker/package-lock.json
      - run: npm ci
      - name: Fetch deployment secrets from Infisical
        if: vars.INFISICAL_PROJECT_SLUG != ''
        uses: Infisical/secrets-action@8802effbe453d0576cd923567dcc2c97a1f54058 # v1.0.15
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ inputs.environment == 'production' && 'prod' || 'staging' }}
          export-type: env
          include-imports: 'false'
      - name: Prepare environment configuration
        run: node scripts/deployment-config.mjs
      - name: Prepare Worker secrets
        env:
          GOOGLE_CLIENT_ID: ${{ vars.INFISICAL_PROJECT_SLUG == '' && secrets.GOOGLE_CLIENT_ID || env.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ vars.INFISICAL_PROJECT_SLUG == '' && secrets.GOOGLE_CLIENT_SECRET || env.GOOGLE_CLIENT_SECRET }}
          BOT_PRIVATE_KEY: ${{ vars.INFISICAL_PROJECT_SLUG == '' && secrets.BOT_PRIVATE_KEY || env.BOT_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ vars.INFISICAL_PROJECT_SLUG == '' && secrets.RESEND_API_KEY || env.RESEND_API_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ vars.INFISICAL_PROJECT_SLUG == '' && secrets.CONTRIBUTION_WEBHOOK_SECRET || env.CONTRIBUTION_WEBHOOK_SECRET }}
        run: node scripts/deployment-secrets.mjs
      - name: Validate deployment bundle
        run: npx --no-install wrangler deploy --config wrangler.deploy.json --env "$DEPLOY_ENV" --dry-run --outdir .wrangler/ci-build
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ vars.INFISICAL_PROJECT_SLUG == '' && secrets.CLOUDFLARE_API_TOKEN || env.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.deploy.json --env "$DEPLOY_ENV"
      - name: Deploy Worker and secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ vars.INFISICAL_PROJECT_SLUG == '' && secrets.CLOUDFLARE_API_TOKEN || env.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler deploy --config wrangler.deploy.json --env "$DEPLOY_ENV" --secrets-file .deploy-secrets.json
      - name: Verify deployment
        run: node scripts/check-deployment.mjs
      - name: Remove temporary secrets
        if: always()
        run: rm -f .deploy-secrets.json
