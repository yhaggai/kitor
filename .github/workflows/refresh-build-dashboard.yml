name: Refresh build dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Validate patch packages']
    types: [completed]
    branches: [v1]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: refresh-build-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'app-v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always use trusted current source, never a PR head or workflow artifact.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: v1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Test monitor catalog and authentication
        run: node --test tools/game-build-monitor/*.test.mjs
      - run: npm ci --prefix tools/ci-wrangler
      - name: Prepare current registry and comparison plans
        run: |
          node tools/game-build-monitor/prepare-gog-plans.mjs
          node --input-type=module -e "import {readFile,writeFile} from 'node:fs/promises'; const registry=JSON.parse(await readFile('kitor/patches/registry.json','utf8')); const plans=JSON.parse(await readFile('website/.astro/monitor-gog-plans.json','utf8')); await writeFile('monitor-catalog.json',JSON.stringify({games:registry.games,plans}));"
      - name: Publish dashboard catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.KITOR_MONITOR_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.KITOR_MONITOR_CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: tools/ci-wrangler/node_modules/.bin/wrangler kv key put published-catalog --path monitor-catalog.json --binding BUILD_SNAPSHOTS --remote --config tools/game-build-monitor/wrangler.jsonc
      - name: Refresh production store builds
        env:
          KITOR_MONITOR_TRIGGER_TOKEN: ${{ secrets.KITOR_MONITOR_TRIGGER_TOKEN }}
        run: node tools/game-build-monitor/refresh-dashboard.mjs
