name: Validate patch packages

on:
  push:
    branches: [v1, main]
    # Only a patch or catalog change should start the patch publishing pipeline.
    paths:
      - 'patches-workspace/**'
      - 'kitor/patches/**'
  workflow_call:
    inputs:
      upload_artifacts:
        description: Upload unverified artifacts
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload unverified package ZIPs (requires available artifact storage)
        type: boolean
        default: false
        required: false

concurrency:
  group: packages-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lifecycle-and-packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Hydrate pinned large payloads from private build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kitor/tools/hydrate_patch_inputs.py --repo "$GITHUB_REPOSITORY"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}
          workspaces: |
            kitor/src-tauri
            kitor/tools/lifecycle-harness
      - name: Build disposable validation CLI
        run: cargo build --manifest-path kitor/tools/lifecycle-harness/Cargo.toml --locked --bin validate_owned_games
      - name: Compile native classic Tentacle installer
        run: cargo build --release --locked --manifest-path kitor/tools/lifecycle-harness/Cargo.toml --bin tentacle_patch
      - name: Compile native Mac remastered candidate
        if: runner.os == 'macOS'
        run: cargo build --release --locked --manifest-path kitor/tools/lifecycle-harness/Cargo.toml --bin tentacle_remastered_patch
      - name: Test package safety and reproducibility
        run: python -m unittest discover -s kitor/tools -p "test_*.py"
      - name: Test native selective installation and restoration fixtures
        run: python kitor/tools/run_lifecycle_tests.py
      - name: Test translation update database recovery
        working-directory: kitor/src-tauri
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: cargo test --lib restore_tests::update_reconciles_stale_database_and_restore_preserves_unrelated_files
      - name: Test catalog behavior and package dispatch
        working-directory: kitor/src-tauri
        shell: bash
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          cargo test --lib services::game_behavior::
          cargo test --lib services::package_source::
          cargo test --lib services::patch_state::
          cargo test --lib services::steam_download_service::capability_tests
      - name: Validate and build all installable manifests
        shell: python
        run: |
          import pathlib, subprocess, sys
          manifests = sorted(pathlib.Path('patches-workspace').glob('*/*/patch.json'))
          if not manifests:
              raise SystemExit('No installable manifests found')
          for manifest in manifests:
              subprocess.run([sys.executable, 'kitor/tools/build_patch_packages.py', str(manifest), '--output', 'dist/patches'], check=True)
          for manifest in sorted(pathlib.Path('patches-workspace').glob('*/he/patch.remastered-source.json')):
              subprocess.run([sys.executable, 'kitor/tools/build_patch_packages.py', str(manifest), '--universal', '--output', 'dist/patches'], check=True)
          for manifest in sorted(pathlib.Path('patches-workspace').glob('*/he/patch.windows.candidate.json')):
              subprocess.run([sys.executable, 'kitor/tools/build_patch_packages.py', str(manifest), '--platform', 'windows', '--output', 'dist/candidates'], check=True)
          for manifest in sorted(pathlib.Path('patches-workspace').glob('*/he/patch.osx.candidate.json')):
              subprocess.run([sys.executable, 'kitor/tools/build_patch_packages.py', str(manifest), '--platform', 'osx', '--output', 'dist/candidates'], check=True)
      - name: Rebuild the Steam-specific Longest Journey package
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, sys
          subprocess.run([sys.executable, 'patches-workspace/tlj/he/build_steam.py', '--output', 'dist/patches'], check=True)
          registry = json.loads(pathlib.Path('kitor/patches/registry.json').read_text(encoding='utf-8'))
          game = next(game for game in registry['games'] if game['scummvm_id'] == 'tlj')
          patch = next(patch for patch in game['patches'] if patch['version'] == 'catalog-20261025-steam1')
          archive = pathlib.Path('dist/patches') / patch['filename']
          with archive.open('rb') as stream:
              checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
          if checksum != patch['checksum'] or archive.stat().st_size != patch['file_size']:
              raise SystemExit('Steam patch archive does not match the registry')
      - name: Validate on-demand archive checksums and catalog coverage
        run: python kitor/tools/build_download_packages.py
      - name: Upload requested unverified package builds
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unverified-patch-builds-${{ matrix.os }}
          path: |
            dist/patches/*.zip
            dist/candidates/*.zip
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: lifecycle-and-packaging
    if: github.event_name == 'push' && (github.ref == 'refs/heads/v1' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-patches.yml
    secrets:
      KITOR_MONITOR_CLOUDFLARE_TOKEN: ${{ secrets.KITOR_MONITOR_CLOUDFLARE_TOKEN }}
      KITOR_MONITOR_TRIGGER_TOKEN: ${{ secrets.KITOR_MONITOR_TRIGGER_TOKEN }}
