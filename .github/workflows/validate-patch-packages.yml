name: Validate patch packages

on:
  push:
    branches: [v1, main]
    paths:
      - 'patches-workspace/**'
      - 'kitor/tools/**'
      - 'kitor/src-tauri/**'
      - '.github/workflows/validate-patch-packages.yml'
      - '.github/workflows/deploy-patches.yml'
  pull_request:
    paths:
      - 'patches-workspace/**'
      - 'kitor/tools/**'
      - 'kitor/src-tauri/**'
      - '.github/workflows/validate-patch-packages.yml'
      - '.github/workflows/deploy-patches.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-and-packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hydrate pinned large payloads from private build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kitor/tools/hydrate_patch_inputs.py --repo ${{ github.repository }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build disposable validation CLI
        run: cargo build --manifest-path kitor/tools/lifecycle-harness/Cargo.toml --locked --bin validate_owned_games
      - name: Compile native classic Tentacle installer
        run: cargo build --release --locked --manifest-path kitor/tools/lifecycle-harness/Cargo.toml --bin tentacle_patch
      - name: Compile native Mac remastered candidate
        if: runner.os == 'macOS'
        run: cargo build --release --locked --manifest-path kitor/tools/lifecycle-harness/Cargo.toml --bin tentacle_remastered_patch
      - name: Test package safety and reproducibility
        run: python -m unittest discover -s kitor/tools -p "test_*.py"
      - name: Test native selective installation and restoration fixtures
        run: python kitor/tools/run_lifecycle_tests.py
      - name: Test translation update database recovery
        working-directory: kitor/src-tauri
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: cargo test --lib restore_tests::update_reconciles_stale_database_and_restore_preserves_unrelated_files
      - name: Validate and build all installable manifests
        shell: python
        run: |
          import pathlib, subprocess, sys
          manifests = sorted(pathlib.Path('patches-workspace').glob('*/he/patch.json'))
          if not manifests:
              raise SystemExit('No installable manifests found')
          for manifest in manifests:
              subprocess.run([sys.executable, 'kitor/tools/build_patch_packages.py', str(manifest), '--output', 'dist/patches'], check=True)
          for manifest in sorted(pathlib.Path('patches-workspace').glob('*/he/patch.remastered-source.json')):
              subprocess.run([sys.executable, 'kitor/tools/build_patch_packages.py', str(manifest), '--universal', '--output', 'dist/patches'], check=True)
          for manifest in sorted(pathlib.Path('patches-workspace').glob('*/he/patch.windows.candidate.json')):
              subprocess.run([sys.executable, 'kitor/tools/build_patch_packages.py', str(manifest), '--platform', 'windows', '--output', 'dist/candidates'], check=True)
          for manifest in sorted(pathlib.Path('patches-workspace').glob('*/he/patch.osx.candidate.json')):
              subprocess.run([sys.executable, 'kitor/tools/build_patch_packages.py', str(manifest), '--platform', 'osx', '--output', 'dist/candidates'], check=True)
      - uses: actions/upload-artifact@v4
        # PRs validate the same packages without retaining large duplicate ZIPs.
        # Branch/manual runs still produce downloadable validation artifacts.
        if: github.event_name != 'pull_request'
        with:
          name: unverified-patch-builds-${{ matrix.os }}
          path: |
            dist/patches/*.zip
            dist/candidates/*.zip
          compression-level: 0
          if-no-files-found: error
