name: GitHub Actions security scan

on:
  pull_request:
    branches: [v1]
  push:
    branches: [v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation-scope:
    uses: $/.github/workflows/classify-translation-pr.yml
  audit:
    needs: translation-scope
    if: needs.translation-scope.outputs.translation_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
