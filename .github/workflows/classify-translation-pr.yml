name: PR checks

on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      translation_only: ${{ steps.classify.outputs.translation_only }}
      installers: ${{ steps.classify.outputs.installers }}
      packages: ${{ steps.classify.outputs.packages }}
      workflow_or_docs_only: ${{ steps.classify.outputs.workflow_or_docs_only }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch comparison base without history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        # The checkout intentionally does not persist credentials. Use the
        # runner's GitHub CLI credential helper only for this fetch.
        run: git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Validate translation-only changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 kitor/tools/check_pr_scope.py "$BASE_SHA" >> "$GITHUB_OUTPUT"

  installers:
    needs: classify
    if: needs.classify.outputs.translation_only != 'true' && needs.classify.outputs.installers == 'true'
    uses: ./.github/workflows/build-installers.yml

  packages:
    needs: classify
    if: needs.classify.outputs.translation_only != 'true' && needs.classify.outputs.packages == 'true'
    # The reusable workflow also contains publishing jobs restricted to push.
    permissions:
      contents: write
    uses: ./.github/workflows/validate-patch-packages.yml

  codeql:
    needs: classify
    if: >-
      github.base_ref == 'v1' &&
      needs.classify.outputs.translation_only != 'true' &&
      needs.classify.outputs.workflow_or_docs_only != 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  workflow-security:
    needs: classify
    if: github.base_ref == 'v1' && needs.classify.outputs.translation_only != 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/zizmor.yml

  dependencies:
    needs: classify
    if: github.base_ref == 'v1' && needs.classify.outputs.translation_only != 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/osv-scanner.yml
