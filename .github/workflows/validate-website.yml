name: Validate website

on:
  pull_request:
    paths:
      - '.github/workflows/validate-website.yml'
      - 'website/**'
      - 'kitor/patches/registry.json'
      - 'kitor/src/data/game-box-covers.json'
      - 'kitor/src/data/game-descriptions.he.json'
      - 'kitor/src/data/game-galleries.json'
      - 'kitor/src/components/GameBox*'
      - 'kitor/public/cover-sq6-he.jpg'
      - 'packages/ui/src/assets/kitor-logo.svg'
      - 'assets/game-boxes/desktop-sources/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
