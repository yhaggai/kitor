[package]
license = "MIT"
name = "kitor"
version = "0.1.3"
description = "Hebrew patch manager for adventure games"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
standalone-patch-tools = []

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
zip = "2.2"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
base64 = "0.22"
url = "2.5"
percent-encoding = "2"
sha2 = "0.10"
md-5 = "0.10"
tempfile = "3"
rand = "0.8"
csv = "1.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-updater = "=2.9.0"

[dependencies.migration]
path = "migration"



[dependencies.kitor-steam]
path = "../native-steam"

# Keep content decoding representative of release speed in the desktop dev app.
[profile.dev.package.lzma-rs]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3

[profile.dev.package.kitor-steam]
opt-level = 3
