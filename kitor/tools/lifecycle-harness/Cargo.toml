[package]
name = "kitor-patch-lifecycle-harness"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["standalone-patch-tools"]
standalone-patch-tools = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bzip2 = "0.5.2"
tempfile = "3"
md-5 = "0.10"
