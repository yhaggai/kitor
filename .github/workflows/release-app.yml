name: Release Kitor app

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: kitor-app-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/v1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate hosted contribution URL
        env:
          KITOR_CONTRIBUTION_API_URL: ${{ vars.KITOR_CONTRIBUTION_API_URL }}
        shell: python
        run: |
          import os
          from urllib.parse import urlsplit

          url = urlsplit(os.environ.get("KITOR_CONTRIBUTION_API_URL", ""))
          if (url.scheme != "https" or not url.hostname or url.username is not None
                  or url.password is not None or url.query or url.fragment
                  or url.path not in ("", "/")):
              raise SystemExit("Set KITOR_CONTRIBUTION_API_URL to the production Worker HTTPS origin")
      - name: Require update signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Verify on-demand patches are published
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kitor/tools/build_download_packages.py --verify-published
      - name: Create draft app release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kitor/tools/app_release.py prepare

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build signed installer and update
        working-directory: kitor
        env:
          KITOR_CONTRIBUTION_API_URL: ${{ vars.KITOR_CONTRIBUTION_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && vars.APPLE_TEAM_ID || '' }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [[ -z "${!name}" ]]; then
                echo "::error::Configure $name for macOS release signing"
                exit 1
              fi
            done
          fi
          bun run tauri build --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify Mac app and notarize disk image
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          shopt -s nullglob
          bundle="kitor/src-tauri/target/$TARGET/release/bundle"
          apps=("$bundle"/macos/*.app)
          images=("$bundle"/dmg/*.dmg)
          if [[ "${#apps[@]}" != 1 || "${#images[@]}" != 1 ]]; then
            echo "::error::Expected one Mac app bundle and one disk image"
            exit 1
          fi

          requirement="anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          codesign --verify --deep --strict -R "$requirement" "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          codesign --verify --strict -R "$requirement" "${images[0]}"
          xcrun notarytool submit "${images[0]}" --wait --output-format json \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            > "$RUNNER_TEMP/kitor-dmg-notarization.json"
          python - "$RUNNER_TEMP/kitor-dmg-notarization.json" <<'PYTHON'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report:
              submission = json.load(report)
          print(f"DMG notarization {submission['id']}: {submission['status']}")
          if submission["status"] != "Accepted":
              sys.exit(1)
          PYTHON
          xcrun stapler staple "${images[0]}"
          xcrun stapler validate "${images[0]}"
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kitor/tools/app_release.py upload --platform ${{ matrix.platform }}

  finalize:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify all platforms and write update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kitor/tools/app_release.py finalize

  publish-feed:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'app-v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Advance the stable app update feed
        env:
          GH_TOKEN: ${{ github.token }}
          APP_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python kitor/tools/app_release.py publish-feed --tag "$APP_RELEASE_TAG"
