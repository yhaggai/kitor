<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קיטור</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .splash-container {
      position: relative;
      width: min(100vw, 150vh);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 16px;
      background: #fff0cf;
      animation: fadeIn 0.6s ease-out;
    }

    .scene {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 2;
      object-fit: contain;
    }

    .loader {
      position: absolute;
      left: var(--loader-left, 96%);
      top: var(--loader-top, 95%);
      width: 3.6%;
      aspect-ratio: 1;
      background: #fff0cf;
      box-shadow: 0 0 0 3px #fff0cf;
      transform: translate(-50%, -50%);
      border: 3px solid rgba(17, 54, 79, 0.2);
      border-top-color: #11364f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite, fadeIn 1s ease-out 0.4s both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes spin {
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-container, .loader {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img alt="קִיטוֹר — דמויות ממשחקי הרפתקאות" class="scene" id="logo" width="1536" height="1024">
    <div class="loader" role="status" aria-label="טוען את קיטור"></div>
  </div>
  <script src="/splashscreen.js?v=retro-2"></script>
</body>
</html>
