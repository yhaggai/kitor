name: Build Kitor installers

on:
  pull_request:
    paths:
      - '.github/workflows/classify-translation-pr.yml'
      - 'kitor/tools/check_translation_pr.py'
      - 'kitor/src/**'
      - 'kitor/src-tauri/**'
      - 'kitor/native-steam/**'
      - 'kitor/public/**'
      - 'packages/ui/**'
      - 'kitor/patches/**'
      - 'patches-workspace/**'
      - 'kitor/tests/**'
      - 'kitor/tools/app_release.py'
      - 'kitor/tools/test_app_release.py'
      - 'kitor/package.json'
      - 'kitor/index.html'
      - 'kitor/postcss.config.js'
      - 'kitor/tailwind.config.js'
      - 'kitor/tsconfig*.json'
      - 'kitor/vite.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-installers.yml'
      - '.github/workflows/release-app.yml'
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload unsigned preview installers
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  translation-scope:
    uses: $/.github/workflows/classify-translation-pr.yml
  installer:
    needs: translation-scope
    if: needs.translation-scope.outputs.translation_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Keep `app` so Tauri does not delete kitor.app before verify.
            bundle: app,dmg
            bundle_dir: dmg
            artifact: macos-apple-silicon
            extension: dmg
          - os: windows-latest
            bundle: nsis
            bundle_dir: nsis
            artifact: windows-x64
            extension: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.2'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}
          workspaces: kitor/src-tauri
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test update states and release manifests
        run: |
          bun test kitor/tests/appUpdates.test.ts
          python -m unittest discover -s kitor/tools -p test_app_release.py
          python kitor/tools/app_release.py validate
      - name: Test installation coordination
        working-directory: kitor/src-tauri
        run: cargo test --locked --lib services::app_updates::tests
      - name: Smoke test bundled GOG extractor on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./kitor/src-tauri/vendor/innoextract/innoextract-x86_64-pc-windows-msvc.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer
        working-directory: kitor
        env:
          INSTALLER_BUNDLE: ${{ matrix.bundle }}
        run: bun run tauri build --bundles "$INSTALLER_BUNDLE" -- --locked
      - name: Verify the macOS bundle contains a working GOG extractor
        if: runner.os == 'macOS'
        run: |
          tool=kitor/src-tauri/target/release/bundle/macos/kitor.app/Contents/MacOS/innoextract
          env PATH=/usr/bin:/bin "$tool" --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        with:
          name: kitor-${{ matrix.artifact }}
          path: kitor/src-tauri/target/release/bundle/${{ matrix.bundle_dir }}/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7
