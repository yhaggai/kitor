name: Check Steam patch files

on:
  schedule:
    - cron: '3 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-steam-patch-files

jobs:
  compare:
    permissions:
      contents: read
      issues: write
    if: vars.KITOR_STEAM_CLOUD_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test monitor authentication and issue reporting
        run: node --test tools/game-build-monitor/*.test.mjs
      - name: Install Linux Steam client build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build --locked --manifest-path kitor/native-steam/Cargo.toml
      - run: npm ci --prefix tools/ci-wrangler
      - name: Refresh stores and compare GOG patch files
        if: github.event_name == 'workflow_dispatch'
        env:
          KITOR_MONITOR_TRIGGER_TOKEN: ${{ secrets.KITOR_MONITOR_TRIGGER_TOKEN }}
        run: |
          node tools/game-build-monitor/trigger-check.mjs scan
          node tools/game-build-monitor/trigger-check.mjs gog
      - name: Compare changed Steam depots
        id: compare_files
        env:
          KITOR_WRANGLER_BIN: ${{ github.workspace }}/tools/ci-wrangler/node_modules/.bin/wrangler
          KITOR_STEAM_CLOUD_SESSION: ${{ secrets.KITOR_STEAM_CLOUD_SESSION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.KITOR_MONITOR_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.KITOR_MONITOR_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$KITOR_STEAM_CLOUD_SESSION" || -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "The cloud Steam runner credentials are missing."
            exit 1
          fi
          node tools/game-build-monitor/run-steam-checks.mjs
      - name: Send new patch alerts
        if: github.event_name == 'workflow_dispatch'
        env:
          KITOR_MONITOR_TRIGGER_TOKEN: ${{ secrets.KITOR_MONITOR_TRIGGER_TOKEN }}
        run: node tools/game-build-monitor/trigger-check.mjs alerts
      - name: Report confirmed patch updates as issues
        if: ${{ !cancelled() && steps.compare_files.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/game-build-monitor/report-issues.mjs
