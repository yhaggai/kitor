[package]
name = "kitor-contribution-bot"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
csv = "1.3"
percent-encoding = "2"
jsonwebtoken = "9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
