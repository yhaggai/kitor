name: Verify Hebrew translation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: dotnet build patcher/Patcher.csproj -c Release
      - run: dotnet build tests/runtime/RuntimeTests.csproj -c Release
      - run: python tools/runtime_fixture.py
      - run: dotnet ../../tests/runtime/bin/Release/net9.0/RuntimeTests.dll
        working-directory: .local/runtime-fixture
      - run: python tools/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: hebrew-source-${{ matrix.os }}
          path: dist/*.zip
