name: Deploy Patches

on:
  push:
    paths:
      - 'patches-workspace/**'
      - 'kitor/tools/**'
      - '.github/workflows/deploy-patches.yml'
      - '.github/workflows/validate-patch-packages.yml'
    branches:
      - main
      - v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-releases
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1'
    uses: ./.github/workflows/validate-patch-packages.yml
    permissions:
      contents: read

  build-and-release-patches:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Hydrate reviewed build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kitor/tools/hydrate_patch_inputs.py --repo "$GITHUB_REPOSITORY"
      - name: Build approved packages
        run: python kitor/tools/prepare_patch_releases.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-release-packages
          path: dist/release-packages/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build-and-release-patches
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout, package tools, or artifact-supplied scripts in this job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: approved-release-packages
          path: release-packages
      - name: Publish validated data assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path

          def validated_releases(root):
              index = root / 'releases.json'
              if index.is_symlink() or index.stat().st_size > 1024 * 1024:
                  raise ValueError('Invalid release index')
              entries = json.loads(index.read_text())
              if not isinstance(entries, list) or len(entries) > 1000:
                  raise ValueError('Invalid release list')
              tags, files = set(), set()
              for entry in entries:
                  if not isinstance(entry, dict) or set(entry) != {'tag', 'filename', 'sha256'}:
                      raise ValueError('Invalid release record')
                  tag, name, checksum = entry['tag'], entry['filename'], entry['sha256']
                  if not isinstance(tag, str) or not re.fullmatch(r'patch-[A-Za-z0-9._-]{1,310}', tag):
                      raise ValueError('Invalid release tag')
                  if not isinstance(name, str) or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,180}\.zip', name):
                      raise ValueError('Invalid asset name')
                  if not isinstance(checksum, str) or not re.fullmatch(r'[0-9a-f]{64}', checksum):
                      raise ValueError('Invalid checksum')
                  if tag in tags or name in files:
                      raise ValueError('Duplicate release')
                  tags.add(tag)
                  files.add(name)
                  path = root / name
                  if path.is_symlink() or not path.is_file() or path.resolve().parent != root.resolve():
                      raise ValueError('Invalid asset path')
                  with path.open('rb') as stream:
                      actual = hashlib.file_digest(stream, 'sha256').hexdigest()
                  if actual != checksum:
                      raise ValueError('Artifact checksum mismatch')
              return entries

          def main():
              root = Path('release-packages')
              entries = validated_releases(root)
              repository, commit = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
              for entry in entries:
                  tag = entry['tag']
                  result = subprocess.run(['gh', 'release', 'view', tag, '--repo', repository,
                                           '--json', 'isDraft'], capture_output=True, text=True)
                  if result.returncode == 0:
                      if json.loads(result.stdout)['isDraft']:
                          raise RuntimeError(f'Existing incomplete draft {tag}; review it before retrying')
                      continue
                  subprocess.run(['gh', 'release', 'create', tag, '--repo', repository,
                                  '--target', commit, '--title', tag, '--notes', 'Validated patch release.', '--draft'], check=True)
                  subprocess.run(['gh', 'release', 'upload', tag, str(root / entry['filename']),
                                  '--repo', repository], check=True)
                  subprocess.run(['gh', 'release', 'edit', tag, '--repo', repository, '--draft=false'], check=True)

          if __name__ == '__main__':
              main()
          PY
