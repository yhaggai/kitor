name: Deploy Patches

on:
  workflow_call:
    secrets:
      KITOR_MONITOR_CLOUDFLARE_TOKEN:
        required: true
      KITOR_MONITOR_TRIGGER_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-translation-patches
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Hydrate pinned build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kitor/tools/hydrate_patch_inputs.py --repo "$GITHUB_REPOSITORY"
      - name: Publish immutable packages and advance registry
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SOURCE_SHA: ${{ github.sha }}
        run: python kitor/tools/publish_patch_releases.py

  refresh-dashboard:
    needs: publish
    uses: ./.github/workflows/refresh-build-dashboard.yml
    secrets:
      KITOR_MONITOR_CLOUDFLARE_TOKEN: ${{ secrets.KITOR_MONITOR_CLOUDFLARE_TOKEN }}
      KITOR_MONITOR_TRIGGER_TOKEN: ${{ secrets.KITOR_MONITOR_TRIGGER_TOKEN }}
