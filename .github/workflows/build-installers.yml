name: Build Kitor installers

on:
  pull_request:
    paths:
      - 'kitor/src/**'
      - 'kitor/src-tauri/**'
      - 'kitor/patches/**'
      - 'patches-workspace/**'
      - 'kitor/tests/**'
      - 'kitor/tools/app_release.py'
      - 'kitor/tools/test_app_release.py'
      - 'kitor/package.json'
      - 'bun.lock'
      - '.github/workflows/build-installers.yml'
      - '.github/workflows/release-app.yml'
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload unsigned preview installers
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: dmg
            artifact: macos-apple-silicon
            extension: dmg
          - os: windows-latest
            bundle: nsis
            artifact: windows-x64
            extension: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test update states and release manifests
        run: |
          bun test kitor/tests/appUpdates.test.ts
          python -m unittest discover -s kitor/tools -p test_app_release.py
          python kitor/tools/app_release.py validate
      - name: Test installation coordination
        working-directory: kitor/src-tauri
        run: cargo test --locked --lib services::app_updates::tests
      - name: Build installer
        working-directory: kitor
        run: bun run tauri build --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        with:
          name: kitor-${{ matrix.artifact }}
          path: kitor/src-tauri/target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7
