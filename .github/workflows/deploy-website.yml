name: Deploy website

on:
  push:
    branches: [v1]
    paths:
      - '.github/workflows/deploy-website.yml'
      - 'website/**'
      - 'tools/ci-wrangler/package*.json'
      - 'kitor/patches/registry.json'
      - 'kitor/src/data/game-box-covers.json'
      - 'kitor/src/data/game-descriptions.he.json'
      - 'kitor/src/data/game-galleries.json'
      - 'kitor/src/components/GameBox*'
      - 'kitor/public/cover-sq6-he.jpg'
      - 'packages/ui/src/assets/kitor-logo.svg'
      - 'assets/game-boxes/desktop-sources/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kitor-website
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/v1'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      KITOR_SITE_URL: ${{ vars.KITOR_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            tools/ci-wrangler/package-lock.json
      - name: Check deployment settings
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
        run: |
          for setting in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT KITOR_SITE_URL INFISICAL_IDENTITY_ID INFISICAL_PROJECT_SLUG; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing $setting. See website/README.md for deployment setup."
              exit 1
            fi
          done
          node --input-type=module -e 'const url = new URL(process.env.KITOR_SITE_URL); if (url.protocol !== "https:") throw new Error("KITOR_SITE_URL must use HTTPS");'
      - name: Install website dependencies
        run: npm ci --prefix website
      - name: Check website
        run: npm run check --prefix website
      - name: Build website and verify game pages
        run: npm run build --prefix website
      - name: Install Wrangler
        run: npm ci --prefix tools/ci-wrangler
      - name: Fetch Cloudflare Pages token from Infisical
        uses: Infisical/secrets-action@8802effbe453d0576cd923567dcc2c97a1f54058 # v1.0.15
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-name: CLOUDFLARE_PAGES_API_TOKEN
          export-type: env
          include-imports: 'false'
      - name: Deploy to Cloudflare Pages
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [[ -z "${CLOUDFLARE_PAGES_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_PAGES_API_TOKEN is empty in Infisical prod."
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_PAGES_API_TOKEN"
          tools/ci-wrangler/node_modules/.bin/wrangler pages deploy website/dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch v1
