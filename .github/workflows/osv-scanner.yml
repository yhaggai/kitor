name: Dependency vulnerability scan

on:
  pull_request:
    branches: [v1]
  push:
    branches: [v1]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation-scope:
    uses: ./.github/workflows/classify-translation-pr.yml
  verify-no-chrono:
    needs: translation-scope
    if: needs.translation-scope.outputs.translation_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Reject Chrono in resolved dependencies
        working-directory: kitor/src-tauri
        run: |
          cargo tree --locked --all-features --target all --edges normal,build,dev --prefix none --format '{p}' > dependencies.txt
          if grep -Eq '^chrono v' dependencies.txt; then
            echo '::error::Chrono is a build dependency. Remove it before relying on the optional-dependency advisory exception.'
            exit 1
          fi

  run-osv-pr:
    needs: [translation-scope, verify-no-chrono]
    permissions:
      actions: read
      contents: read
      security-events: write
    if: github.event_name == 'pull_request' && needs.translation-scope.outputs.translation_only != 'true'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1

  osv-pr-result:
    # Keep the check name required by branch protection on v1.
    name: scan-pr / osv-scan
    needs: [translation-scope, verify-no-chrono, run-osv-pr]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify scan or translation-only result
        env:
          CLASSIFIER_RESULT: ${{ needs.translation-scope.result }}
          TRANSLATION_ONLY: ${{ needs.translation-scope.outputs.translation_only }}
          CHRONO_RESULT: ${{ needs.verify-no-chrono.result }}
          SCAN_RESULT: ${{ needs.run-osv-pr.result }}
        run: |
          if [[ "$CLASSIFIER_RESULT" == success ]]; then
            if [[ "$TRANSLATION_ONLY" == true && "$CHRONO_RESULT" == skipped && "$SCAN_RESULT" == skipped ]]; then
              exit 0
            fi
            if [[ "$TRANSLATION_ONLY" == false && "$CHRONO_RESULT" == success && "$SCAN_RESULT" == success ]]; then
              exit 0
            fi
          fi
          echo '::error::OSV scan or translation classification did not complete successfully.'
          exit 1

  scan-repository:
    needs: [translation-scope, verify-no-chrono]
    permissions:
      actions: read
      contents: read
      security-events: write
    if: github.event_name != 'pull_request' && needs.translation-scope.outputs.translation_only != 'true'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
