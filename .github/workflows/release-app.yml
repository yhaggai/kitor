name: Release Kitor app

on:
  workflow_dispatch:
    inputs:
      verify_macos:
        description: Build and verify signed macOS installers without creating a release
        type: boolean
        default: false
      resume_windows:
        description: Resume Windows upload for an existing draft with unchanged app sources
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: kitor-app-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/v1' || inputs.verify_macos)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate hosted contribution URL
        if: ${{ !inputs.verify_macos }}
        env:
          KITOR_CONTRIBUTION_API_URL: ${{ vars.KITOR_CONTRIBUTION_API_URL }}
        shell: python
        run: |
          import os
          from urllib.parse import urlsplit

          url = urlsplit(os.environ.get("KITOR_CONTRIBUTION_API_URL", ""))
          if (url.scheme != "https" or not url.hostname or url.username is not None
                  or url.password is not None or url.query or url.fragment
                  or url.path not in ("", "/")):
              raise SystemExit("Set KITOR_CONTRIBUTION_API_URL to the production Worker HTTPS origin")
      - name: Require update signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Verify on-demand patches are published
        if: ${{ !inputs.verify_macos }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kitor/tools/build_download_packages.py --verify-published
      - name: Create draft app release
        if: ${{ !inputs.verify_macos && !inputs.resume_windows }}
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kitor/tools/app_release.py prepare
      - name: Select builds and verify draft recovery inputs
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_WINDOWS: ${{ inputs.resume_windows }}
          VERIFY_MACOS: ${{ inputs.verify_macos }}
        shell: python
        run: |
          import json, os, re, subprocess, sys
          sys.path.insert(0, "kitor/tools")
          import app_release

          builds = [
              {"os": "macos-latest", "target": "aarch64-apple-darwin", "platform": "darwin-aarch64", "bundles": "app,dmg"},
              {"os": "macos-latest", "target": "x86_64-apple-darwin", "platform": "darwin-x86_64", "bundles": "app,dmg"},
              {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "platform": "windows-x86_64", "bundles": "nsis"},
          ]
          if os.environ["RESUME_WINDOWS"] == "true":
              if os.environ["VERIFY_MACOS"] == "true":
                  raise SystemExit("Draft recovery cannot run in verification-only mode")
              draft = app_release.release("app-v" + app_release.configured_version())
              source = draft["target_commitish"]
              if not draft["draft"] or draft["prerelease"] or not re.fullmatch(r"[0-9a-f]{40}", source):
                  raise SystemExit("Recovery requires an unpublished stable draft with an exact source SHA")
              subprocess.run(["git", "fetch", "--depth=1", "origin", source], check=True)
              changed = set(subprocess.check_output(["git", "diff", "--name-only", source, "HEAD"], text=True).splitlines())
              if changed - {".github/workflows/release-app.yml"}:
                  raise SystemExit("App sources changed since the draft; do not mix platform builds")
              assets = app_release.asset_map(draft)
              for platform in ("darwin-aarch64", "darwin-x86_64"):
                  name = app_release.filename(app_release.configured_version(), platform)
                  for required in (name, name + ".sig", name.replace(".app.tar.gz", ".dmg")):
                      if required not in assets or assets[required]["size"] <= 0:
                          raise SystemExit("Recovery requires both completed Mac platform uploads")
              builds = builds[-1:]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf8") as output:
              output.write("matrix=" + json.dumps({"include": builds}) + "\n")

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.2'
          no-cache: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build signed installer and update
        if: ${{ !inputs.verify_macos || runner.os == 'macOS' }}
        working-directory: kitor
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BUNDLES: ${{ matrix.bundles }}
          KITOR_CONTRIBUTION_API_URL: ${{ vars.KITOR_CONTRIBUTION_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && vars.APPLE_TEAM_ID || '' }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [[ -z "${!name}" ]]; then
                echo "::error::Configure $name for macOS release signing"
                exit 1
              fi
            done
          fi
          bun run tauri build --config src-tauri/tauri.release.conf.json --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES" -- --locked
      - name: Verify Mac app and notarize disk image
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          shopt -s nullglob
          bundle="kitor/src-tauri/target/$TARGET/release/bundle"
          apps=("$bundle"/macos/*.app)
          images=("$bundle"/dmg/*.dmg)
          if [[ "${#apps[@]}" != 1 || "${#images[@]}" != 1 ]]; then
            echo "::error::Expected one Mac app bundle and one disk image"
            exit 1
          fi

          requirement="anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          codesign --verify --deep --strict -R="$requirement" "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          codesign --verify --strict -R="$requirement" "${images[0]}"
          xcrun notarytool submit "${images[0]}" --wait --output-format json \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            > "$RUNNER_TEMP/kitor-dmg-notarization.json"
          python - "$RUNNER_TEMP/kitor-dmg-notarization.json" <<'PYTHON'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report:
              submission = json.load(report)
          print(f"DMG notarization {submission['id']}: {submission['status']}")
          if submission["status"] != "Accepted":
              sys.exit(1)
          PYTHON
          xcrun stapler staple "${images[0]}"
          xcrun stapler validate "${images[0]}"
      - name: Save verified disk image
        if: inputs.verify_macos && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kitor-${{ matrix.platform }}
          path: kitor/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Upload to draft release
        if: ${{ !inputs.verify_macos }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: python kitor/tools/app_release.py upload --platform "$RELEASE_PLATFORM"

  finalize:
    if: ${{ !inputs.verify_macos }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify all platforms and write update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kitor/tools/app_release.py finalize

  publish-feed:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'app-v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          ref: v1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Advance the stable app update feed
        env:
          GH_TOKEN: ${{ github.token }}
          APP_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python kitor/tools/app_release.py publish-feed --tag "$APP_RELEASE_TAG"
